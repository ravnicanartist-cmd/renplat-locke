<script>
window.GAME = {
  id: "rp", store: "rp", gist: "renplat-locke.json", v: 5, save: "pt",
  tabs: [["G", "Gyms & League"], ["V", "Villains"], ["R", "Rivals & required fights"], ["A", "Everything, in story order"]],
  starters: ["Turtwig", "Chimchar", "Piplup"],
  genders: [["M", "a boy (you face Dawn)"], ["F", "a girl (you face Lucas)"]],
  calc: "../calc/?data=26138cc1d500b0cf7334&gen=7&switchIn=4&types=6&dmgGen=4",
  badges: { roark: "Coal", gardenia: "Forest", fantina: "Relic", maylene: "Cobble", wake: "Fen", byron: "Mine", candice: "Icicle", volkner: "Beacon" },
  leaders: ["roark", "gardenia", "fantina", "maylene", "wake", "byron", "candice", "volkner", "cynthia"],
  nav: [["#prep", "Boss Prep"], ["#trainers", "Trainers"], ["#run", "Nuzlocke"], ["#box", "Box"], ["#dex", "Pokédex"], ["#ai", "Enemy AI"], ["#data", "Save &amp; sync"],
        ["../calc/?data=26138cc1d500b0cf7334&gen=7&switchIn=4&types=6&dmgGen=4", "Calc ↗"], ["../#gauntlet", "Gauntlet"]],
  trainersNote: "Teams from PChal's Trainer Battles sheet, with levels, items and moves checked against the ROM.",
  dexIntro: "Renegade Platinum species data as it is in this ROM (Complete patch): types, base stats, abilities, evolutions and where to find each one.",
  ai: window.AI4(`<ul><li>Renegade Platinum gives almost everyone the boss AI: <b>460 of the 469</b> trainers matched in the ROM have flags 0 + 1 + 2 (Basic, Evaluate Attack, Expert). Expect nearly every trainer to go for KOs and use status moves sensibly.</li>
      <li>Only a handful of early or minor trainers (a Hiker, a Roughneck, a Jogger, some Galactic Grunts) are basic-only.</li></ul>`),
  how: cap => `
      <p><b>Your options.</b> Every species you can catch, be given, trade for or hatch in the areas you can reach before this fight, respecting when Surf, the fishing rods and honey trees become available. Each is evolved as far as it can go by the level cap (${cap} here: the documentation's cap for this part of the game, which is the next gym leader's ace). Level, friendship (instant in this build) and item evolutions count once the item can be found; Razor Fang has no location in the docs, so Gligar stays Gligar.</p>
      <p><b>Moves.</b> Level-up moves up to the cap (Lv 1 moves only once the Pastoria move reminder can be reached), TMs from when you can really pick them up (no Poké Mart sells TMs; gym TMs after the gym, Substitute removed), and every move tutor once Maylene is beaten (PChal's PC tutors).</p>`
};
</script>
